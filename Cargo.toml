[package]
name = "offline-dub"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "CPU-only local video transcription and dubbing for Windows"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[profile.release]
lto = true
strip = true
